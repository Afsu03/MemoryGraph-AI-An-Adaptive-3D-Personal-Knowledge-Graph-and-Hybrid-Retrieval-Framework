[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memorygraph-ai"
version = "0.1.0"
description = "An Adaptive 3D Personal Knowledge Graph and Hybrid Retrieval Framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Afsana Parveen" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Visualization"
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "networkx>=3.2.1",
    "umap-learn>=0.5.5",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
